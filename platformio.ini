; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino

; Configuration Flash & PSRAM (Standard Freenove ESP32-S3 N8R8 / N16R8)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

; Moniteur série et vitesse de téléversement
monitor_speed = 115200
upload_speed = 921600

; Flags de compilation : USB CDC actif + Optimisation NimBLE
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DCORE_DEBUG_LEVEL=1

; Bibliothèques requises (Pile NimBLE + Couche BLE-MIDI)
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    lathoub/BLE-MIDI @ ^2.2
    fortyseveneffects/MIDI Library @ ^5.0.2

